# 1D CNN stroke classifier (T3.8, T3.9, T11.6). Used by scripts/train_stroke_classifier.py.

seed: 42
algorithm: cnn

data:
  features_dir: data/features
  # The BST ShuttleSet features (scripts/import_bst_features.py, D29). For our own clips
  # (scripts/extract_features.py --pose-norm bbox_diag) pass --splits configs/splits.json,
  # the committed match split.
  splits: configs/splits_bst.json
  pose_norm: bbox_diag          # how the features were built; stored in the checkpoint
  use_trajectory: true          # false for the pose-only ablation
  classes: [smash, clear, drop, net_shot, lift, serve]

model:
  dropout: 0.3

train:
  epochs: 40
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  class_weighting: inverse_frequency
  early_stopping_patience: 8

output:
  checkpoint: weights/strokes/stroke_cnn.pt
  metrics: outputs/stroke_cnn_metrics.json
