# Pipeline settings. Thresholds live here, not in code (CONTRIBUTING.md).
# Each stage reads its own block via StageContext.stage_config("<name>"). Exceptions: pose
# also reads court.court_size_m; render reads tracking.trail_length and
# hits.marker_duration_s. Display-only keys (weight, trail_length, marker_duration_s) are
# left out of the stage cache keys, so changing them only re-renders.
# Any stage may set `weight:` (share of job progress; defaults tracking 4, pose 4,
# render 2, others 0.2) and `enabled: false`.

seed: 42  # reserved: no pipeline stage is random yet (training seeds: stroke_cnn.yaml)

watch:
  stroke_min_confidence: 0.5  # heuristic; validate against labelled footage
  parallel_perception: false  # experimental; benchmark and validate before enabling

stages:
  io:
    enabled: true
    target_height: 720          # normalize resolution (T2.1)
    max_fps: 30                 # downsample higher frame rates
    max_duration_s: 600         # FR-1: up to 10 minutes

  tracking:
    enabled: true
    tracknet_weights: weights/tracknet/TrackNet_best.pt
    # InpaintNet is optional: raw TrackNet detections are kept if its weights are missing.
    inpaintnet_weights: weights/tracknet/InpaintNet_best.pt
    batch_size: 16
    use_inpaintnet: true        # TrackNetV3 trajectory rectification (T2.3)
    max_gap_frames: 8           # interpolate gaps up to this length (T2.3)
    outlier_px: 80              # isolated detection this far from the track is dropped
    # precomputed_csv: path/to/upstream_predict.csv   # use TrackNetV3 predict.py output
    # precomputed_space: source   # source = original frames/pixels; normalized = our tracking.csv
    trail_length: 12            # FR-2: 8 to 15 positions

  pose:
    enabled: true
    backend: rtmlib             # rtmlib | keypoint_rcnn (decided in T1.5)
    mode: balanced              # rtmlib: lightweight | balanced | performance
    min_person_score: 0.4
    smoothing_window: 5
    min_keypoint_score: 0.3     # joints below this count as missing
    confirmation_frames: 3      # consistent detections before a slot is locked
    max_step_m: 0.5             # maximum court movement from last observation
    max_step_box_fraction: 0.6  # maximum image displacement relative to box height
    max_reacquire_gap_frames: 90 # bounded recovery window for a missing locked player
    reacquire_step_per_frame_m: 0.15 # expand movement gate while a player is missing
    reacquire_max_step_m: 1.5    # never match beyond this distance from last position
    reacquire_box_step_per_frame: 0.1
    reacquire_max_box_fraction: 1.2
    reacquire_confirm_after_frames: 5 # confirm candidates again after a longer gap
    reacquire_confirmation_frames: 2
    max_appearance_distance: 0.45
    locked_jump_margin_m: 0.3    # only for recently matched, locked players
    locked_jump_max_distance_m: 0.35
    locked_jump_max_appearance: 0.25
    locked_jump_max_missing_frames: 2
    locked_jump_max_frames: 9   # limit continuous outside-boundary exceptions
    far_locked_jump_margin_m: 1.5 # far-court floor projection is less reliable during jumps
    far_locked_jump_min_iou: 0.45 # require strong overlap with the last locked box
    far_locked_jump_max_frames: 18
    far_jump_max_ankle_spread_m: 2.2 # reject mixed-player feet when landing
    match_ambiguity: 0.15       # reject near-tied identity matches
    duplicate_iou: 0.65         # suppress repeated boxes only when poses also closely agree
    duplicate_pose_fraction: 0.1 # upper-body joint distance as a fraction of player height
    far_refinement_enabled: true # focused second pose pass only during a far-player gap
    far_refinement_hold_frames: 12 # continue refinement briefly after recovery
    far_refinement_max_missing: 45 # don't keep retrying long-lost players
    hold_frames: 5              # legacy tracker only; missing players are now reported as absent
    appearance_weight: 2.0      # legacy doubles tracker only
    partners_close_m: 0.6       # legacy doubles tracker only

  court:
    enabled: true
    court_size_m: [5.18, 13.40]  # singles: width x length

  hits:
    enabled: true
    min_angle_deg: 60           # direction change threshold
    max_wrist_distance_px: 120  # at 720p
    min_frames_between_hits: 8
    rally_break_frames: 30      # shuttle unseen this long = new rally, same hitter allowed
    hitter_window_frames: 3     # doubles: frames either side of a hit to find the partner
    ambiguous_px: 25            # doubles: wrists this close (720p) = hitter left unknown
    marker_duration_s: 0.5

  strokes:
    enabled: true
    algorithm: cnn              # cnn | lstm | rf (D28); a job's stroke_model replaces it
    weights: weights/strokes/stroke_cnn.pt
    weights_lstm: weights/strokes/stroke_lstm.pt
    weights_rf: weights/strokes/stroke_rf.npz
    # The window, the pose rule and the feature layout come from the checkpoint; these two
    # are only used for a checkpoint that does not say. Live mode waits window_frames / 2
    # frames after a hit before classifying it.
    window_frames: 32
    use_trajectory: true        # false = pose-only ablation

  feedback:
    enabled: true               # rules: docs/FEEDBACK_RULES.md
    min_stroke_confidence_doubles: 0.5  # doubles: no form tips on strokes the model is unsure of
    min_keypoint_score: 0.3
    window_frames: 2            # contact rules use the hit frame +- this
    elbow_extension_deg: 150
    lunge_knee_deg: 140
    drop_follow_through: 0.6    # wrist travel after contact, in box heights
    serve_feet_motion: 0.1      # ankle travel before the serve, in box heights
    patterns:                   # session notes (F21), docs/FEEDBACK_RULES.md
      min_count: 2              # a pattern needs at least this many faulty strokes
      min_rate: 0.5             # ... and this share of the strokes the rule checked
      top_fixes: 3
      max_moments: 5            # timeline moments listed per note
      severity:                 # coaching priority; pose cues are not service-fault judgments
        contact_below_waist: 1.0
        stable_feet: 1.0
        shots_out: 1.5

  analytics:
    enabled: true
    speed_smoothing: 3          # frames, NaN-aware moving average
    position_smoothing: 5       # frames, player court positions
    hit_speed_frames: 5         # hit speed = peak in this many frames after the hit

  referee:
    enabled: true
    stationary_frames_end: 20   # shuttle still on floor for N frames ends a rally
    lost_frames_end: 30
    line_call:                  # F20, docs/PRD.md: automated calls, never official
      court: singles            # singles | doubles lines
      homography_err_m: 0.05    # line position error from the corner taps
      tracking_err_px: 4.0      # shuttle position error in pixels, scaled to meters per landing
      min_band_m: 0.05          # uncertainty band never narrower than this

  render:
    enabled: true
    player_box_hold_s: 0.6      # display only; never used as a player observation
    codec: libx264
    crf: 23
    minimap_corner: top-right   # top-left | top-right | bottom-left | bottom-right

# Live sessions (F19, D16): WS /live, see docs/ARCHITECTURE.md
live:
  budget_ms: 300               # p95 frame arrival -> frame event target on the team GPU
  tick_every: 5                # frames between runs of the windowed hits/referee stages
  max_window_frames: 900       # the window never grows past 30 s at 30 fps
  background_frames: 30        # TrackNet background median from the first frames
  check_every: 30              # processed frames between quality checks
  max_drop_rate: 0.2           # skipping more than this share of frames lowers quality
  scales: [1.0, 0.75, 0.5]     # perception input scale per quality level (0, 1, 2)
  max_fps: 30                  # a faster camera is thinned to this by capture time
  target_height: 720
  max_queue_frames: 60         # prefer recent frames within each control-delimited batch
