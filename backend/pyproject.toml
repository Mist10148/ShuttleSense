[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shuttlesense"
version = "0.1.0"
description = "Badminton stroke classification, shuttlecock tracking and match analysis."
readme = { text = "See the repository README.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "ShuttleSense team" }]

[project.scripts]
shuttlesense = "shuttlesense.run:main"

[tool.setuptools.packages.find]
include = ["shuttlesense*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
