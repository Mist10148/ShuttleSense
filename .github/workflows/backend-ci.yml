name: backend

on:
  push:
    branches: [main]
    # test_openapi_snapshot reads docs/openapi.json; check_links.py reads every Markdown file.
    paths: ["backend/**", "docs/**", "*.md", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "docs/**", "*.md", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TrackNetV3 lives in backend/third_party as a submodule (T1.3).
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install (base + dev, no ML stack)
        run: |
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e .
      - name: Lint
        run: |
          ruff check .
          python scripts/check_format.py
      - name: Docs links
        run: python scripts/check_links.py
      - name: Test
        # gpu tests need CUDA, weights and the team's sample clips.
        run: pytest -m "not gpu"
