name: backend

on:
  push:
    branches: [main]
    # test_openapi_snapshot reads docs/openapi.json.
    paths: ["backend/**", "docs/openapi.json", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "docs/openapi.json", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install (base + dev, no ML stack)
        run: |
          pip install -r requirements/base.txt -r requirements/dev.txt
          pip install -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
